[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "meerdata"
dynamic = ["version"]
description = "MeerKLASS data management tool for downloading and processing telescope data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "MeerKLASS Team"}
]
keywords = ["meerklass", "data-management", "astronomy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "click",
    "numpy",
    "python-casacore",
    "katdal",
    "katpoint",
    "katdal",
    "museek @ git+https://github.com/meerklass/museek.git",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/meerklass/meerdata"
Documentation = "https://github.com/meerklass/meerdata/blob/main/README.md"
Repository = "https://github.com/meerklass/meerdata"
"Bug Tracker" = "https://github.com/meerklass/meerdata/issues"

[project.scripts]
meerdata = "meerdata.cli:cli"
"mvftoms_otf_patch.py" = "meerdata.mvftoms_otf_patch:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"