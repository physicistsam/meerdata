# Site config for the CHPC Lengau cluster (https://www.chpc.ac.za/).
#
# Lengau uses PBS Pro, not SLURM, and compute nodes have no internet access.
# Because of that, `download` (the rclone/mvf_download.py step that pulls
# from the SARAO archive) is never submitted as a PBS job -- meerdata always
# runs it locally in the foreground, before submitting the remaining steps
# to PBS. See CHPC_SETUP.md in MOTF-newsetup for the full writeup: `download`
# is expected to run inside a persistent `screen`/`tmux` session on
# scp.chpc.ac.za (CHPC's dedicated data-transfer node), not on the shared
# login node lengau.chpc.ac.za and never on a compute node.
#
# Project code, queue, and paths below are filled in from what's already
# confirmed working for this account's other CHPC pipelines (MWA_*, see
# ~/softy/MWA_vis_analysis/docs/chpc_context/chpc_pbs_submission.md) as of
# 2026-09-14. **`-P ASTR0945` is this account's general astronomy project
# code on Lengau -- confirm with the PI/CHPC allocation admin that it also
# covers MeerKLASS/meerdata work before relying on it; it was not granted
# specifically for this project.** Queue choice per that doc, checked
# against this cluster's live `qstat -Qf`:
#   - `smp`    : resources_min.ncpus=24, max 96h -- a whole 24-core/128GB
#                node guaranteed. Used for auto/ms (ncpus=24 requests).
#   - `serial` : max ncpus 24, max 48h, shares a node, RAM not guaranteed.
#                Used for cleanup/sanity-check (ncpus=1 requests) -- `normal`
#                would be wrong for these, since it forces resources_min.
#                ncpus=25 (2+ nodes) which a 1-cpu request can't satisfy.

detect:
  # Lengau's actual FQDN (login1.cm.cluster) doesn't contain "chpc.ac.za", so
  # hostname alone isn't a reliable marker here -- `qstat --version` (PBS
  # Pro's own version string, mirrors how ilifu.yaml uses `lsid`) plus the
  # CHPC-specific filesystem paths are used instead. Both are required
  # (min_markers: 2) so a bare `path_exists` hit alone (which checks the real
  # filesystem even under mocked-environment tests) can't misfire detection.
  path_exists:
    - "/mnt/lustre/users"
    - "/home/apps/chpc"
  command:
    name: "qstat"
    output_contains: "pbs_version"
  min_markers: 2

scheduler: pbs

# Storage note: /mnt/lustre is CHPC's large Lustre scratch/project filesystem
# (petabyte-scale, distinct from $HOME which is a much smaller NFS mount) --
# same filesystem the stimela container images already live on (see
# CHPC_SETUP.md). It is subject to periodic automated cleanup (this account
# has had files removed by a "lustre-clean" pass before, evidenced by
# `lustre-clean-*.log` files dropped in-place under
# /mnt/lustre/users/schatterjee/) -- do not treat it as permanent archival
# storage for raw MS/rdb data; move anything long-lived off to proper
# archival storage once processed.
paths:
  venv: "/home/schatterjee/vnv/vnv_meerdata"
  data_folder: "/mnt/lustre/users/schatterjee/meerklass/raw_data"
  sanity_check_folder: "/mnt/lustre/users/schatterjee/meerklass/sanity_checks"

pbs:
  modules: []
  qsub_path: "qsub"

  # Applied to every generated job. Any qsub-compatible "-flag value" or
  # "-flag=value" directive is allowed here.
  options:
    - "-P ASTR0945"
    - "-q smp"

  # Per-step options, merged on top of `options` above (step values win on
  # conflicting flags). No `download` entry: that step never runs under PBS
  # on this site (see note above).
  resources:
    auto:
      - "-l select=1:ncpus=24:mem=50gb"
      - "-l walltime=00:30:00"
    ms:
      - "-l select=1:ncpus=24:mem=50gb"
      - "-l walltime=06:00:00"
    cleanup:
      - "-q serial"
      - "-l select=1:ncpus=1:mem=1gb"
      - "-l walltime=00:30:00"
    sanity-check:
      - "-q serial"
      - "-l select=1:ncpus=1:mem=4gb"
      - "-l walltime=00:08:00"
